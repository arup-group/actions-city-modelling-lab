name: Reusable workflow validator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: true

      - name: Install action-validator with asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47  # v4.0.1
        with:
          tool_versions: action-validator 0.5.3

      - name: Lint Actions
        run: action-validator --verbose .github/actions/**/*.y*ml

      - name: Lint Workflows
        run: action-validator --verbose .github/workflows/*.y*ml
